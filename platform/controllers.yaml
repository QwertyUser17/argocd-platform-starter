# Wave 0: CRDs and controllers every other layer depends on.
# One Application per component (platform/controllers/*/component.yaml) per cluster labelled env=dev|stage|prod.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-controllers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: env
                    operator: In
                    values: [dev, stage, prod]
          - git:
              repoURL: https://github.com/QwertyUser17/argocd-platform-starter.git
              revision: main
              files:
                - path: platform/controllers/*/component.yaml
  template:
    metadata:
      name: '{{ .component.name }}-{{ index .metadata.labels "env" }}'
      labels:
        layer: platform
        env: '{{ index .metadata.labels "env" }}'
    spec:
      project: platform
      sources:
        - repoURL: '{{ .component.repoURL }}'
          chart: '{{ .component.chart }}'
          targetRevision: '{{ .component.version }}'
          helm:
            releaseName: '{{ .component.name }}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{ .path.path }}/values.yaml
              - $values/{{ .path.path }}/values-{{ index .metadata.labels "env" }}.yaml
        - repoURL: https://github.com/QwertyUser17/argocd-platform-starter.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: '{{ .component.namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Lets a chart ship a custom resource together with the CRD that defines it.
          - SkipDryRunOnMissingResource=true
        retry:
          # Retries pick up the latest commit and generated spec instead of repeating the failed
          # revision, e.g. a sync that started with the old chart version but the new values.
          refresh: true
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
