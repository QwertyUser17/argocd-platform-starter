# Builds the image once per git tag and points the dev overlay at it.
# Stage and prod never rebuild: promote.yml copies the same tag and digest forward.
name: build

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/qwertyuser17/demo-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Refuse to overwrite an existing tag
        run: |
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$GITHUB_REF_NAME already exists; tags are immutable, push a new one"
            exit 1
          fi

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: src/demo-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Commit the new image to the dev overlay
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
          FILE: environments/dev/demo-api/kustomization.yaml
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGE))) |= (.newTag = strenv(TAG) | .digest = strenv(DIGEST))' "$FILE"
          git config user.name "QwertyUser17"
          git config user.email "44494231+QwertyUser17@users.noreply.github.com"
          git commit -am "deploy(dev): demo-api $TAG"
          git push origin HEAD:main
