# Promotes the image already running in the previous environment: dev -> stage -> prod.
# Nothing is built here; the tag and digest are copied between overlays.
# Stage gets a direct commit, prod gets a pull request.
name: promote

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to promote to
        type: choice
        options: [stage, prod]

env:
  IMAGE: ghcr.io/qwertyuser17/demo-api

concurrency:
  group: gitops-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Read the image from the previous environment
        run: |
          case "$TARGET" in
            stage) source=dev ;;
            prod) source=stage ;;
          esac
          file="environments/$source/demo-api/kustomization.yaml"
          tag=$(yq '(.images[] | select(.name == strenv(IMAGE))).newTag' "$file")
          digest=$(yq '(.images[] | select(.name == strenv(IMAGE))).digest' "$file")
          if [ "$digest" = "null" ] || [ -z "$digest" ]; then
            echo "::error::$file has no digest; build a tag first"
            exit 1
          fi
          {
            echo "SOURCE=$source"
            echo "TAG=$tag"
            echo "DIGEST=$digest"
          } >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image exists in the registry
        run: docker buildx imagetools inspect "$IMAGE:$TAG@$DIGEST"

      - name: Update the target overlay
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGE))) |= (.newTag = strenv(TAG) | .digest = strenv(DIGEST))' \
            "environments/$TARGET/demo-api/kustomization.yaml"
          git config user.name "QwertyUser17"
          git config user.email "44494231+QwertyUser17@users.noreply.github.com"

      - name: Commit to main
        if: inputs.target == 'stage'
        run: |
          git commit -am "deploy(stage): demo-api $TAG"
          git push origin HEAD:main

      - name: Open a pull request
        if: inputs.target == 'prod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="promote/prod-demo-api-$TAG"
          git switch -c "$branch"
          git commit -am "deploy(prod): demo-api $TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "deploy(prod): demo-api $TAG" \
            --body "Promotes \`$IMAGE:$TAG@$DIGEST\` from $SOURCE. The image is the one built for the tag; nothing was rebuilt."
